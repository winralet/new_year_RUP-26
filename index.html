
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#004895">
    <meta name="description" content="С Новым годом! Праздничный сайт со снегом и обратным отсчётом.">

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

    <link rel="icon"
        href="https://cdn-icons-png.flaticon.com/128/9120/9120864.png"
        type="image/png">

    <title>С Новым годом!</title>
</head>

<body class="locked">

<main class="container">

    <!-- СНЕГОПАД -->
    <canvas id="canvas" aria-hidden="true"></canvas>

    <!-- ГЛАВНЫЙ БЛОК -->
    <section class="box-text">

        <div class="title-wrapper">

            <div class="magic-glow"></div>

            <h1 class="title">С новым годом!</h1>

            <div class="title-sparkles" aria-hidden="true">
                <span>✦</span>
                <span>✧</span>
                <span>✦</span>
                <span>❄</span>
                <span>✧</span>
                <span>✦</span>
            </div>

        </div>

        <!-- КНОПКИ -->
        <div class="btn-group">

            <button id="scroll-btn" class="btn" type="button">
                До нового года осталось...

                <img class="btn-hat"
                    src="https://res.cloudinary.com/freecodez/image/upload/v1701705719/images/guidvrtf8kre7pc3jdk5.webp"
                    alt="">
            </button>

            <button id="snowball-btn" class="btn" type="button"
                onclick="window.location.href='game.html';">

                Игра в снежки

                <img class="btn-hat"
                    src="https://res.cloudinary.com/freecodez/image/upload/v1701705719/images/guidvrtf8kre7pc3jdk5.webp"
                    alt="">
            </button>

        </div>

    </section>


    <!-- ВЕРХНИЕ ОБЛАКА -->
    <div class="cloud" id="cloud1"></div>
    <div class="cloud" id="cloud2"></div>
    <div class="cloud" id="cloud3"></div>
    <div class="cloud" id="cloud4"></div>
    <div class="cloud" id="cloud5"></div>
    <div class="cloud" id="cloud6"></div>
    <div class="cloud" id="cloud7"></div>
    <div class="cloud" id="cloud8"></div>
    <div class="cloud" id="cloud9"></div>
    <div class="cloud" id="cloud10"></div>


    <!-- НИЖНИЕ ОБЛАКА -->
    <div class="cloud" id="cloud1_down"></div>
    <div class="cloud" id="cloud2_down"></div>
    <div class="cloud" id="cloud3_down"></div>
    <div class="cloud" id="cloud4_down"></div>
    <div class="cloud" id="cloud5_down"></div>
    <div class="cloud" id="cloud6_down"></div>
    <div class="cloud" id="cloud7_down"></div>
    <div class="cloud" id="cloud8_down"></div>
    <div class="cloud" id="cloud9_down"></div>
    <div class="cloud" id="cloud10_down"></div>


    <!-- ПРАЗДНИЧНОЕ ПРОСТРАНСТВО -->
    <div class="winter-space" aria-hidden="true">

        <div class="winter-message">
            ❄ Сказка начинается... ❄
        </div>

        <div class="winter-decoration">✦</div>
        <div class="winter-decoration">❄</div>
        <div class="winter-decoration">✧</div>

    </div>


    <!-- СЧЁТЧИК -->
    <section id="countdownContainer">

        <h2 id="headline">
            <span>
                ДО НОВОГО ГОДА ОСТАЛОСЬ

                <img class="btn-hat"
                    src="https://res.cloudinary.com/freecodez/image/upload/v1701705719/images/guidvrtf8kre7pc3jdk5.webp"
                    alt="">
            </span>
        </h2>

        <div id="countdown">

            <ul>

                <li>
                    <span id="days">0</span>
                    Дней
                </li>

                <li>
                    <span id="hours">0</span>
                    Часов
                </li>

                <li>
                    <span id="minutes">0</span>
                    Минут
                </li>

                <li>
                    <span id="seconds">0</span>
                    Секунд
                </li>

            </ul>

        </div>

    </section>


    <!-- НИЖНИЙ ПРАЗДНИЧНЫЙ БЛОК -->
    <footer class="winter-footer">

        <div class="footer-snow">
            ❄ ✦ ❄ ✧ ❄
        </div>

        <p>
            Пусть каждый день в техникуме будет волшебным!
        </p>

        <span>
            С любовью от Руп-26 ❤️
        </span>

    </footer>

</main>

<script src="script.js" defer></script>

</body>
</html>
